apiVersion: apps/v1
kind: Deployment
metadata:
  name: mesh-api
  namespace: dev
spec:
  replicas: 2

  selector:
    matchLabels:
      app: mesh-api

  template:
    metadata:
      labels:
        app: mesh-api

    spec:
      containers:
        - name: mesh-api
          image: nginx:1.28

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
